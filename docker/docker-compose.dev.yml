# Docker Compose cho Development
# Đơn giản hơn, dùng cho dev/test local

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: udkpb_mysql_dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: udkpb
      MYSQL_USER: udkpb_user
      MYSQL_PASSWORD: udkpb_dev
    volumes:
      - mysql_dev_data:/var/lib/mysql
    ports:
      - "${DEV_DB_PORT:-3307}:3306"
    command: --default-authentication-plugin=mysql_native_password

  # Redis
  redis:
    image: redis:7-alpine
    container_name: udkpb_redis_dev
    restart: unless-stopped
    ports:
      - "${DEV_REDIS_PORT:-6380}:6379"

  # Django Web (Development mode)
  web:
    image: udkpb_web:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: udkpb_web_dev
    restart: unless-stopped
    environment:
      DEBUG: "True"
      SECRET_KEY: "dev-secret-key-not-for-production"
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: udkpb
      DB_USER: udkpb_user
      DB_PASSWORD: udkpb_dev
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      AI_SERVER_BASE_URL: ${DEV_AI_SERVER_BASE_URL:-http://ai-server:8081}
      AI_SERVER_HEALTH_TIMEOUT: "${DEV_AI_SERVER_HEALTH_TIMEOUT:-2}"
      ALLOWED_HOSTS: "*"
      RUNNING_IN_DOCKER: "1"
      SYSTEM_CONFIG_SUBPROCESS_CONTROL: "False"
      COLLECTSTATIC_ON_START: "0"
      CREATE_DEFAULT_SUPERUSER: "0"
    volumes:
      - ../UDKPB/kiem_phieu_bau:/app/kiem_phieu_bau
      - ../UDKPB/ai_core:/app/ai_core
      - media_dev_files:/app/kiem_phieu_bau/media
    ports:
      - "${DEV_WEB_PORT:-8001}:8000"
    depends_on:
      - mysql
      - redis
    command: python manage.py runserver 0.0.0.0:8000

  # AI Server
  ai-server:
    image: udkpb_ai_runtime:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile.celery
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: udkpb_ai_server_dev
    restart: unless-stopped
    environment:
      RUNNING_IN_DOCKER: "1"
      SYSTEM_CONFIG_SUBPROCESS_CONTROL: "False"
    volumes:
      - ../UDKPB/ai_core:/app/ai_core
      - media_dev_files:/app/kiem_phieu_bau/media
    ports:
      - "${DEV_AI_PORT:-8081}:8081"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "--quiet", "-O", "/dev/null", "http://localhost:8081/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    command: python /app/ai_core/ai_server/run_waitress_ai.py
    profiles:
      - ai  # Chỉ chạy khi cần AI: docker compose -f docker/docker-compose.dev.yml --profile ai up -d

  # Celery Worker
  celery-worker:
    image: udkpb_ai_runtime:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile.celery
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: udkpb_celery_dev
    restart: unless-stopped
    environment:
      DEBUG: "True"
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: udkpb
      DB_USER: udkpb_user
      DB_PASSWORD: udkpb_dev
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      AI_SERVER_BASE_URL: ${DEV_AI_SERVER_BASE_URL:-http://ai-server:8081}
      RUNNING_IN_DOCKER: "1"
      SYSTEM_CONFIG_SUBPROCESS_CONTROL: "False"
    volumes:
      - ../UDKPB/kiem_phieu_bau:/app/kiem_phieu_bau
      - ../UDKPB/ai_core:/app/ai_core
      - media_dev_files:/app/kiem_phieu_bau/media
    depends_on:
      - mysql
      - redis
    command: celery -A kiem_phieu_bau worker -Q upload_queue,counting_queue,default --pool=solo -l info

volumes:
  mysql_dev_data:
  media_dev_files:
